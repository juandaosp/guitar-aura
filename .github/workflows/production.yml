name: Deployment - Production Environment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-or-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Architecture Guard
        run: npm run architecture:check

      - name: Next.js Build Verification
        run: npm run build

      # Este paso SOLO se ejecuta si se hace push a main (es decir, el PR fue aprobado y mergeado)
      - name: Deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "🔥 DESPLEGANDO EN PRODUCCIÓN! El código es seguro y estable."
          # Aquí iría tu comando de despliegue de producción
