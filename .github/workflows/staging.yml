name: Deployment - Staging Environment

on:
  push:
    branches: [stg]

jobs:
  build-and-deploy-stg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Architecture Guard
        run: npm run architecture:check

      - name: Next.js Build Verification
        run: npm run build

      - name: Simulate Staging Deploy
        run: |
          echo "🚀 Desplegando en el ambiente de STAGING con éxito!"
